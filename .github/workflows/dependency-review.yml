# Dependency review: GitHub's dependency comparison between a pull request's base and head, read
# over the API, failing on a dependency the pull request adds or moves to with a known
# vulnerability (core's #4585). The bundle locks under .github/bundle-lock/ and each app's UI
# lock are in the dependency graph, so a bundle's new dependency is reviewed too.
#
# It never checks out or runs the pull request's code: the action reads the base and head
# commits from the event and asks the dependency-graph API to compare them, with a read-only
# token. There is no checkout here at all; do not add one.
#
# WHOSE COPY RUNS: THE HEAD'S. It runs on `pull_request`, as feedback that gates nothing: GitHub's
# default policy stops `pull_request_target` runs in public repositories from 2026-12-02, and no
# workflow here runs on that event (test_check_commit_provenance.py holds that). It is not a
# required check, as no check here is. A merge verdict for this repository (core's #5516) would
# read the dependency graph itself, as core's does, rather than this run.
name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per pull request: a new head cancels the review of the old one.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
