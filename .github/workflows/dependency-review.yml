# Dependency review: GitHub's dependency comparison between a pull request's base and head, read
# over the API, failing on a dependency the pull request adds or moves to with a known
# vulnerability (core's #4585). The bundle locks under .github/bundle-lock/ and each app's UI
# lock are in the dependency graph, so a bundle's new dependency is reviewed too.
#
# It never checks out or runs the pull request's code: the action reads the base and head
# commits from the event and asks the dependency-graph API to compare them, with a read-only
# token. There is no checkout here at all; do not add one.
#
# WHOSE COPY RUNS: MAIN'S. Under `pull_request_target` GitHub runs this file as it is on main, so
# a pull request cannot edit what reviews it, and the merge verdict (core's #5516) counts this run
# as the base branch's. It is the one workflow besides dco.yml that runs on `pull_request_target`
# (test_check_commit_provenance.py holds that), and with no checkout it has nothing of the pull
# request to run. Not a required check: the one required verdict reads it.
name: Dependency review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# One review per pull request: a new head cancels the review of the old one.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
