# DCO — every commit a pull request brings, and its title, checked against the commit policy.
#
# scripts/check_commit_provenance.py, core's own check, in `pr` mode: rule 1 (a Signed-off-by
# matching the author), rule 3 (no co-author or tool marks on a maintainer's commit) and rule 5
# (no marker, in a commit message or in the title, that would start no run). Rule 2, the
# committer list, applies on main only: on a pull request a contributor commits their own work.
# Every push to main runs all four, in provenance.yml.
#
# WHY ITS OWN WORKFLOW, not a job in ci.yml. Rule 5 reads the title, so this workflow runs again
# when a pull request is edited. In ci.yml that would run every job again on each edit of a title
# or a description, and cancel the run in progress.
#
# WHAT RULE 5 MAY NOT SEE. GitHub documents its skip markers for `push` and `pull_request` runs,
# so a marker in a head commit's message stops CI but not this `pull_request_target` run; rule 5
# here catches it in the title and in every commit. On main the marker would start no
# provenance.yml run, and that push's commits would land unchecked for good.
#
# WHOSE COPY RUNS: MAIN'S. Under `pull_request_target` GitHub runs this file as it is on main,
# so a pull request cannot edit what checks it, and the merge verdict (core's #5516) counts this
# run as the base branch's. The one checkout is main's copy of the check and MAINTAINERS (no
# `ref:` and no `repository:`, so GitHub checks out the base branch, and a sparse list of those
# two files). The pull request's commits arrive as metadata over the commits API: no file and no
# git object of the pull request is ever on disk, so nothing of it can run. The job token is
# read-only (`contents` and `pull-requests`, read) and reaches only the step that runs `gh api`.
#
# SAFETY: `pull_request_target` runs in the base repository's context, so it must never run what
# a pull request brings (the "pwn request"). Do NOT add a checkout of the pull request's head, a
# fetch of its ref, or a step that runs code from the workspace beyond main's check. Any job here
# that would run a pull request's code belongs in ci.yml, under `pull_request`.
#
# There is no remediation comment, as core posts: that needs `pull-requests: write`, and each
# violation is already an annotation naming the commit and the rule.
name: DCO

on:
  pull_request_target:
    # `edited`: rule 5 reads the title, so a title edited after the last push is checked again,
    # and removing a marker from it clears the red without a new push.
    types: [opened, edited, synchronize, reopened]

# One run per pull request in flight: a new push or edit supersedes the check in progress, and
# the run that replaces it reads the pull request as it then is.
concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    # The commits come from the commits API, as core's DCO workflow reads them. It returns at
    # most 250 and then stops paginating without an error, and it answers for the pull request
    # as it is when asked, so the check is handed the pull request's own count and head, and
    # refuses a list that falls short of the one or does not end at the other.
    # Dependabot is exempt from the sign-off rule, per COMMIT by its exact author address, not by
    # the run's triggering actor: it still holds after a maintainer pushes a fix onto a
    # dependabot branch, which changes github.actor to a human.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # list the pull request's commits
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      # The check and MAINTAINERS, and nothing else: the check reads only the JSON below, never
      # a git object, so no history is fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/check_commit_provenance.py
            MAINTAINERS
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Besides the checkout, which fetches with the job token and keeps no credential, the token
      # reaches one step: this one, which runs nothing but `gh api`. The check that parses what
      # the pull request supplied runs in the next step, with no token at all.
      - name: Fetch the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/commits" > "$RUNNER_TEMP/commits.json"
      - name: Verify DCO sign-off on every commit
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The runner image's own python3, isolated: the check is standard-library Python, and
        # nothing is installed. Exit 1 is a violation, exit 2 is a check that could not run; both
        # fail, and each violation is an annotation naming the commit and the rule. The title is
        # read from the event file, never pasted into this script.
        run: |
          set -euo pipefail
          python3 -I scripts/check_commit_provenance.py --mode pr \
            --maintainers MAINTAINERS \
            --commits-json "$RUNNER_TEMP/commits.json" \
            --expected-count "$COMMITS" \
            --expected-head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_PATH"
