# CI — first-party app bundles. Verifies every app against the platform contract.
# Tests install each bundle's declared dependencies; undeclared vendor SDKs remain
# absent so apps that intentionally omit them must stub them. Every job's work is a part
# of scripts/gate.py, the one apps gate a local run calls too (`make gate`). Jobs:
# static (every .github/scripts/check_*.py, one row each) · tests (.github/tests once,
# then each bundle's suite) · quality-declarations · dco (PR-only).
# Every job that installs core installs the one commit core.lock pins (read and exported by
# scripts/core_lock.py, which prints it), so a re-run tests the same core. Core main's own
# drift is the weekly canary's to report (core-main-canary.yml), not this workflow's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own: the image's
  # system 3.12 is a different patch from the one setup-python and core's 3.12 legs run.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  static:
    # Every static check, in one job: scripts/gate.py's `static` part runs
    # .github/scripts/run_checks.py, which finds every check_*.py there (so a new check is a
    # row the first time it exists), runs each in a process of its own and keeps going past a
    # red. Each check is its own row in the job summary, named as the docs cite it
    # (boundary, manifest-validate, ui-bundles, ...), its output is a log group of its own,
    # and a failed one is an annotation naming it. The job is red when any row is.
    # Core is installed because manifest-validate parses every app.json with core's own
    # parser; Node is set up because ui-bundles rebuilds every committed UI bundle with npm.
    runs-on: ubuntu-24.04
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Read core.lock
        # CORE_SHA and CORE_SPEC for the steps below; the log line names the core under test.
        run: uv run --no-project --python 3.12.15 python scripts/core_lock.py export
      - name: Install core (for the manifest-validate check)
        # A uv-managed venv, not `--system`: the runner's /usr is PEP-668 externally-managed.
        # Exported on PATH/env so later steps' `python` resolves to it.
        run: |
          uv venv --python 3.12.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC"
      - name: Every static check, one row each
        # --core refuses to run when the installed core is not the locked commit.
        run: python scripts/gate.py static --core "$CORE_SHA" --results "$RUNNER_TEMP/gate"
      - name: Keep the gate's receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-static
          path: ${{ runner.temp }}/gate
          if-no-files-found: error

  tests:
    # Each bundle's test_*.py runs after its manifest-declared Python dependencies
    # are installed. Undeclared vendor SDKs remain absent, so model apps still stub
    # SDKs they deliberately do not declare.
    runs-on: ubuntu-24.04
    # No job-level PERSONALCLAW_HOME: one home shared by every test defeats the
    # Path.home()/HOME patches some tests isolate themselves with, the same mismatch
    # documented in the core test job. The repository's conftest.py gives each test a
    # scratch home of its own instead, so no run resolves the real ~/.personalclaw.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # browser-connector's tests drive its extension worker with Node's own test runner.
        with:
          node-version-file: .nvmrc
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Read core.lock
        # CORE_SHA and CORE_SPEC for the steps below; the log line names the core under test.
        run: uv run --no-project --python 3.12.15 python scripts/core_lock.py export
      - name: Install core + pytest
        # uv-managed venv (not `--system`: the runner's /usr is PEP-668
        # externally-managed). Exporting VIRTUAL_ENV makes later `uv pip install`
        # and `python` in this job resolve to the venv automatically.
        run: |
          uv venv --python 3.12.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist==3.8.0
      - name: The repository's own tests, then each bundle's suite
        # scripts/gate.py's `rails` part runs every .github/tests file in one pytest
        # invocation over two workers: the rails over every bundle (cli steps load as core
        # loads them, SDK calls bind, model apps prove the wire, declared core features, the
        # scratch home and the guards conftest.py installs) and each static check's
        # planted-defect tests. Its `bundles` part is scripts/test_bundles.py, the single
        # definition of a bundle run shared by CI and local use: it discovers tested app
        # bundles, installs each manifest's declared pythonDependencies, and invokes pytest
        # separately per bundle to avoid basename clashes. Both parts run even when the first
        # is red. --core refuses to run when the installed core is not the locked commit.
        run: python scripts/gate.py rails bundles --core "$CORE_SHA" --results "$RUNNER_TEMP/gate"
      - name: Keep the gate's receipt and each bundle's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-tests
          path: ${{ runner.temp }}/gate
          if-no-files-found: error

  quality-declarations:
    # A `quality` block in app.json — {tested, designSystem, a11y} — is what the Store
    # renders as a badge row, so for a FIRST-PARTY app it is a promise, not decoration.
    # This job holds it to account: core's verifier
    # re-checks every CLAIM against the bundle's own evidence — the tests actually pass,
    # token-lint is clean, the axe report exists, matches this version and is empty —
    # and exits 1 on any claim the bundle cannot back. An axis left absent, or declared
    # honestly false ("legacy"/"n/a"), claims nothing and is never punished.
    #
    # The check IS core's module, invoked verbatim — deliberately not a second
    # implementation here. Re-deriving the token-lint patterns or the pass rules in this
    # repo would mint exactly the declared-vs-actual drift the job exists to catch, one
    # layer down. `needs: [tests]` so a declaring app whose own suite is red can never
    # reach a green quality job.
    needs: [tests]
    runs-on: ubuntu-24.04
    env:
      # Same reason as the `tests` job: the verifier RUNS each declaring bundle's
      # pytest, so it needs the posture those tests are written against.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # The verifier runs each bundle's pytest, browser-connector's Node-driven worker tests included.
        with:
          node-version-file: .nvmrc
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Read core.lock
        # CORE_SHA and CORE_SPEC for the steps below; the log line names the core under test.
        run: uv run --no-project --python 3.12.15 python scripts/core_lock.py export
      - name: Install core + pytest
        # Mirrors static/tests: a uv-managed venv (the runner's /usr is
        # PEP-668 externally-managed, so `--system` is refused), exported on PATH/env so
        # later steps' `python` and `uv pip` resolve to it. pytest is required, not
        # optional: verifying `tested: true` means running the bundle's tests for real.
        run: |
          uv venv --python 3.12.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest==9.1.1 pytest-asyncio==1.4.0
      - name: The installed core is the locked one
        # This job runs core's verifier directly, not through the gate, so it checks the pin itself.
        run: python scripts/core_lock.py verify
      - name: "Census the claims, install what a `tested` claim needs"
        # Two things, one manifest read.
        # (1) The census is PRINTED so a green run stays legible: "no app claimed
        #     anything" and "claims were checked and held" are different facts, and a
        #     guard whose log cannot tell them apart is how a guard rots unnoticed.
        # (2) The deps matter because the verifier really runs the bundle's pytest — an
        #     HONEST `tested: true` on an app that needs its SDK (slack-channel →
        #     slack-sdk) would otherwise red as a lie. Scoped to DECLARING bundles only:
        #     the reason `tests` installs per bundle is to keep torch out of every job.
        run: |
          deps=$(python - <<'PY'
          import json, pathlib, sys
          axes = {"tested": 0, "designSystem": 0, "a11y": 0}
          claiming, deps = [], []
          apps = sorted(pathlib.Path(".").glob("*/app.json"))
          for mf in apps:
              try:
                  d = json.loads(mf.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  # NOT swallowed: said out loud, and the red is still raised — by
                  # the static job's manifest-validate check, and again by the verifier's own `manifest`
                  # violation. This census must not be the thing that reports it.
                  print(f"{mf}: unreadable ({exc}) — skipped for census", file=sys.stderr)
                  continue
              q = d.get("quality")
              if not isinstance(q, dict):
                  continue
              # The three VERIFIABLE values, mirroring QualityDeclaration.claims():
              # `true` / `"v2"` is a claim; anything else (absent, false, "legacy",
              # "n/a") claims nothing and is not counted or punished.
              claimed = []
              if q.get("tested") is True:
                  claimed.append("tested")
                  deps += (d.get("dependencies") or {}).get("pythonDependencies") or []
              if q.get("designSystem") == "v2":
                  claimed.append("designSystem")
              if q.get("a11y") is True:
                  claimed.append("a11y")
              for a in claimed:
                  axes[a] += 1
              if claimed:
                  claiming.append(f"{mf.parent.name}({'+'.join(claimed)})")
          print(
              f"quality claims over {len(apps)} app(s): tested={axes['tested']} "
              f"designSystem={axes['designSystem']} a11y={axes['a11y']} — declared by: "
              f"{', '.join(claiming) or '(none)'}",
              file=sys.stderr,
          )
          print(" ".join(sorted(set(deps))))
          PY
          )
          if [ -n "$deps" ]; then
            echo "installing declaring bundles' deps: $deps"
            uv pip install $deps
          else
            echo "no bundle claims quality.tested — no deps to install"
          fi
      - name: Every declared claim is backed by the bundle's evidence
        # Exit 1 on a dishonest claim AND on a tree with no */app.json at all (a
        # checker that silently checked nothing is the failure mode this guards).
        run: python -m personalclaw.apps.quality .

  dco:
    # Every commit in a PR must carry a Signed-off-by trailer (DCO),
    # same provenance rule as core. Pure-git check, PR-only.
    # Dependabot is exempt: its bot commits cannot carry a Signed-off-by trailer,
    # and dependency bumps are provenance-clear by construction. The exemption is
    # per-COMMIT (skip commits authored by dependabot), not gated on the run's
    # triggering actor — so it still holds after a maintainer pushes a fix onto a
    # dependabot branch (rebase, lockfile regen), which changes github.actor to a
    # human and would otherwise re-fail on dependabot's own unsigned commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The check reads local history only (git rev-list, git show), so no credential stays.
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            email="$(git show -s --format='%ae' "$sha")"
            # Skip dependabot's own commits — a bot can't sign off, and bumps are
            # provenance-clear. Maintainer commits on the same branch still checked.
            case "$email" in
              *dependabot*@users.noreply.github.com) continue ;;
            esac
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "$author"; then
              echo "::error::commit $sha is missing a matching 'Signed-off-by: $author' trailer — run: git commit -s (or git rebase --signoff)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off."
          exit "$missing"
