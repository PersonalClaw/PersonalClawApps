# CI — first-party app bundles. Verifies every app against the platform contract.
# Tests install each bundle's declared dependencies; undeclared vendor SDKs remain
# absent so apps that intentionally omit them must stub them. Jobs per CI-RELEASE-ENGINEERING §"apps repo":
# manifest-validate · tests · quality-declarations · boundary · live-writes-posture ·
# prompt-cache-posture · settings-schema-posture · readme-census · store-card-copy · dco (PR-only).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Core is installed from main until PyPI has a release (DISTRIBUTION S2);
  # switch to a pinned "personalclaw==<version>" then. (dated 2026-07-20)
  CORE_SPEC: "personalclaw @ git+https://github.com/PersonalClaw/PersonalClaw@main"

jobs:
  manifest-validate:
    # Every app.json parses against core's own manifest parser (the real contract),
    # not a hand-rolled schema — so a manifest that core would reject fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install core (for personalclaw.apps.manifest)
        # Install into a uv-managed venv, not `--system`: the runner's /usr is
        # PEP-668 externally-managed and uv refuses `--system` there. Export the venv
        # on PATH/env so later steps' `python` and `uv pip` resolve to it.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC"
      - name: Validate every app.json
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from personalclaw.apps.manifest import AppManifest
          bad = []
          for mf in sorted(pathlib.Path(".").glob("*/app.json")):
              try:
                  m = AppManifest.from_dict(json.loads(mf.read_text()))
                  # round-trip must be stable (the parity contract apps rely on)
                  assert AppManifest.from_dict(m.to_dict()).to_dict() == m.to_dict()
                  errs = m.validate()
                  if errs:
                      bad.append(f"{mf}: " + "; ".join(errs))
              except Exception as e:  # noqa: BLE001
                  bad.append(f"{mf}: {type(e).__name__}: {e}")
              # every published bundle ships its own LICENSE — a bundle is
              # installed standalone, so the repo-root file does not travel with it
              lic = mf.parent / "LICENSE"
              if not lic.exists():
                  bad.append(f"{mf.parent}: missing LICENSE (copy the repo-root MIT file)")
                  continue
              # a manifest that DECLARES a license must agree with the file it ships —
              # a declared MIT-0 over an MIT file tells installers the wrong terms.
              # Only known first-lines are mapped; an unrecognized file is not guessed at.
              declared = json.loads(mf.read_text()).get("license")
              first = lic.read_text().splitlines()[0].strip() if lic.read_text().strip() else ""
              actual = {"MIT License": "MIT", "MIT No Attribution": "MIT-0"}.get(first)
              if declared and actual and declared != actual:
                  bad.append(f"{mf}: declares license {declared} but LICENSE file is {actual}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"OK: {len(list(pathlib.Path('.').glob('*/app.json')))} manifests valid + licensed")
          PY

  tests:
    # Each bundle's test_*.py runs after its manifest-declared Python dependencies
    # are installed. Undeclared vendor SDKs remain absent, so model apps still stub
    # SDKs they deliberately do not declare.
    runs-on: ubuntu-latest
    # No job-level PERSONALCLAW_HOME: one home shared by every test defeats the
    # Path.home()/HOME patches some tests isolate themselves with, the same mismatch
    # documented in the core test job. The repository's conftest.py gives each test a
    # scratch home of its own instead, so no run resolves the real ~/.personalclaw.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install core + pytest
        # uv-managed venv (not `--system`: the runner's /usr is PEP-668
        # externally-managed). Exporting VIRTUAL_ENV makes later `uv pip install`
        # and `python` in this job resolve to the venv automatically.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest pytest-asyncio
      - name: Test the per-bundle runner dependency rail
        run: python -m pytest .github/tests/test_bundle_runner.py -q
      - name: Every app's cli.setup / cli.doctor loads the way personalclaw setup / doctor load it
        # Each bundle's own suite puts the app directory on sys.path first, so a step that cannot
        # load from the installed copy still passes there. This loads each one as core does.
        run: python -m pytest .github/tests/test_cli_steps_load.py -q
      - name: Every chat-model app proves its requests carry the per-call temperature and max_tokens
        # Each bundle's test_wire.py drives its real SDK client against apps_testkit/model_wire.py;
        # this refuses a chat-model app that ships without one.
        run: python -m pytest .github/tests/test_model_apps_prove_the_wire.py -q
      - name: Every app's SDK imports are published and every SDK call binds
        # The static rails in apps_testkit/sdk_contract.py, over every bundle. Only
        # slack-channel's suite ran them, so vector-store-qdrant's CredentialStore() call,
        # missing the home it requires, failed on every connect with nothing to name it.
        run: python -m pytest .github/tests/test_sdk_calls_bind.py -q
      - name: Every test runs against a scratch PersonalClaw home
        # conftest.py gives every test its own; pytest.ini makes pytest load it however it starts.
        run: python -m pytest .github/tests/test_scratch_home.py -q
      - name: Run each bundle's tests (per-bundle)
        # The repository runner is the single definition shared by CI and local use:
        # it discovers tested app bundles, installs each manifest's declared
        # pythonDependencies, and invokes pytest separately to avoid basename clashes.
        run: ./scripts/test-bundles

  quality-declarations:
    # A `quality` block in app.json — {tested, designSystem, a11y} — is what the Store
    # renders as a badge row, so for a FIRST-PARTY app it is a promise, not decoration.
    # This job holds it to account (APP-PLATFORM-EVOLUTION T2.1): core's verifier
    # re-checks every CLAIM against the bundle's own evidence — the tests actually pass,
    # token-lint is clean, the axe report exists, matches this version and is empty —
    # and exits 1 on any claim the bundle cannot back. An axis left absent, or declared
    # honestly false ("legacy"/"n/a"), claims nothing and is never punished.
    #
    # The check IS core's module, invoked verbatim — deliberately not a second
    # implementation here. Re-deriving the token-lint patterns or the pass rules in this
    # repo would mint exactly the declared-vs-actual drift the job exists to catch, one
    # layer down. `needs: [tests]` so a declaring app whose own suite is red can never
    # reach a green quality job.
    needs: [tests]
    runs-on: ubuntu-latest
    env:
      # Same reason as the `tests` job: the verifier RUNS each declaring bundle's
      # pytest, so it needs the posture those tests are written against.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install core + pytest
        # Mirrors manifest-validate/tests: a uv-managed venv (the runner's /usr is
        # PEP-668 externally-managed, so `--system` is refused), exported on PATH/env so
        # later steps' `python` and `uv pip` resolve to it. pytest is required, not
        # optional: verifying `tested: true` means running the bundle's tests for real.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest pytest-asyncio
      - name: "Census the claims, install what a `tested` claim needs"
        # Two things, one manifest read.
        # (1) The census is PRINTED so a green run stays legible: "no app claimed
        #     anything" and "claims were checked and held" are different facts, and a
        #     guard whose log cannot tell them apart is how a guard rots unnoticed.
        # (2) The deps matter because the verifier really runs the bundle's pytest — an
        #     HONEST `tested: true` on an app that needs its SDK (slack-channel →
        #     slack-sdk) would otherwise red as a lie. Scoped to DECLARING bundles only:
        #     the reason `tests` installs per bundle is to keep torch out of every job.
        run: |
          deps=$(python - <<'PY'
          import json, pathlib, sys
          axes = {"tested": 0, "designSystem": 0, "a11y": 0}
          claiming, deps = [], []
          apps = sorted(pathlib.Path(".").glob("*/app.json"))
          for mf in apps:
              try:
                  d = json.loads(mf.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  # NOT swallowed: said out loud, and the red is still raised — by
                  # manifest-validate, and again by the verifier's own `manifest`
                  # violation. This census must not be the thing that reports it.
                  print(f"{mf}: unreadable ({exc}) — skipped for census", file=sys.stderr)
                  continue
              q = d.get("quality")
              if not isinstance(q, dict):
                  continue
              # The three VERIFIABLE values, mirroring QualityDeclaration.claims():
              # `true` / `"v2"` is a claim; anything else (absent, false, "legacy",
              # "n/a") claims nothing and is not counted or punished.
              claimed = []
              if q.get("tested") is True:
                  claimed.append("tested")
                  deps += (d.get("dependencies") or {}).get("pythonDependencies") or []
              if q.get("designSystem") == "v2":
                  claimed.append("designSystem")
              if q.get("a11y") is True:
                  claimed.append("a11y")
              for a in claimed:
                  axes[a] += 1
              if claimed:
                  claiming.append(f"{mf.parent.name}({'+'.join(claimed)})")
          print(
              f"quality claims over {len(apps)} app(s): tested={axes['tested']} "
              f"designSystem={axes['designSystem']} a11y={axes['a11y']} — declared by: "
              f"{', '.join(claiming) or '(none)'}",
              file=sys.stderr,
          )
          print(" ".join(sorted(set(deps))))
          PY
          )
          if [ -n "$deps" ]; then
            echo "installing declaring bundles' deps: $deps"
            uv pip install $deps
          else
            echo "no bundle claims quality.tested — no deps to install"
          fi
      - name: Every declared claim is backed by the bundle's evidence
        # Exit 1 on a dishonest claim AND on a tree with no */app.json at all (a
        # checker that silently checked nothing is the failure mode this guards).
        run: python -m personalclaw.apps.quality .

  boundary:
    # SDK-only import lint from the apps side: an installed app may import core ONLY
    # via personalclaw.sdk.* — never deep internals. Mirrors core's
    # tests/test_apps_import_boundary.py, run against this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pure-stdlib ast lint — no uv, no core install needed. (An earlier
      # `uv python install` step was dead cruft: uv isn't set up in this job.)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint app imports (personalclaw.sdk.* only)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          violations = {}
          for f in sorted(pathlib.Path(".").rglob("*/*.py")):
              if "__pycache__" in f.parts or f.name.startswith("test_"):
                  continue
              tree = ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
              bad = []
              def check(mod):
                  if mod and mod.startswith("personalclaw"):
                      parts = mod.split(".")
                      if not (len(parts) >= 2 and parts[1] == "sdk"):
                          bad.append(mod)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          check(a.name)
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      check(node.module)
              if bad:
                  violations[str(f)] = sorted(set(bad))
          if violations:
              for f, mods in sorted(violations.items()):
                  print(f"  {f}: {mods}")
              print("\nApps must import core only via personalclaw.sdk.* — promote the "
                    "needed symbol to an sdk submodule instead of reaching around it.")
              sys.exit(1)
          print("OK: all app imports go through personalclaw.sdk.*")
          PY

  live-writes-posture:
    # Every channel app's send() must honor the platform's DISABLE_LIVE_WRITES kill
    # switch (AUTONOMY-GUARDRAILS §1.4). Core cannot enforce this — the transport owns
    # its own wire call — so it is enforced here. Pure-stdlib AST lint, no core install:
    # the script is a committed file (not an inline heredoc) so a contributor runs the
    # EXACT same check locally that CI runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every channel send() honors DISABLE_LIVE_WRITES
        run: python .github/scripts/check_live_writes_posture.py

  prompt-cache-posture:
    # Cross-app rail (PCS-8): every model-provider app must declare a `prompt_cache`
    # posture explicitly, with the evidence beside it, and an EXPLICIT posture must
    # actually translate the neutral marker. A cross-app sweep can't live in one app's
    # test_*.py (the tests job runs pytest PER bundle), so it rides here alongside the
    # other two cross-app sweeps. Pure stdlib — no core install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check prompt-cache posture declarations
        run: python .github/scripts/check_prompt_cache_posture.py

  settings-schema-posture:
    # Cross-app rail (AP-10): one convention for `advanced` and `required` settings
    # fields — optional tuning fields fold, required fields never fold, api_key is
    # never required. Lives here with the other cross-app sweeps for the same reason
    # they do: the tests job runs pytest PER bundle. Pure stdlib — no core install.
    #
    # Rule 4 (added 2026-09-07) also gates `x-meta.sensitive` on credential-shaped
    # fields. That one MUST live here rather than in core: core's equivalent rail
    # resolves the apps clone as a sibling of its own checkout, which does not exist on
    # a runner, so its corpus half scans only core's 30 bundled manifests — a tree with
    # zero credential-shaped fields — and so passes green while a real violation sits in
    # this repo. It surfaced `openai-tools.api_key` only when run by hand from a
    # workspace that happened to hold both clones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check settings-schema advanced/required/sensitive posture
        run: python .github/scripts/check_settings_schema_posture.py

  settings-declared-reads:
    # The OTHER half of the settings contract, and the half `settings-schema-posture`
    # above is structurally blind to: a setting the provider CODE reads which the
    # manifest schema never declares. Every rule in that rail iterates the declared
    # properties, so an undeclared one is invisible to all of them and the schema reads
    # clean.
    #
    # Two failures live there. A DEAD setting (the config form renders only declared
    # properties, so the operator cannot set it and the read takes its default forever —
    # `bedrock-models.max_tokens` and `claude-subscription.max_tokens`, both fixed in the
    # commit that adds this rail) and an UNMASKABLE credential (core's masking keys
    # entirely off a declared `x-meta.sensitive` property, so no masker can see an
    # undeclared one — the defect all four published satellite exemplars carried, in
    # repositories that have no catalogue CI at all).
    #
    # Pure stdlib — no core install. Cross-app by necessity: the tests job runs pytest
    # PER bundle, so no bundle can see the denominator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every setting the code reads is declared in the manifest schema
        run: python .github/scripts/check_settings_declared_reads.py

  settings-route-ratchet:
    # Cross-app rail: provider settings moved out of the removed Settings/Tools
    # route. Scan every tracked file because runtime refusals, CLI output, READMEs,
    # and inline docs can all drift independently, while pytest runs per bundle.
    # The committed script covers both arrow encodings and split-line forms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject references to the removed settings route
        run: python .github/scripts/check_settings_route_references.py

  trigger-source-adoption:
    # Cross-app rail (CE-10): every app that declares a `channel` transport must also declare
    # a `trigger_source` provider, MEASURED over the channel apps DISCOVERED rather than
    # against a remembered count — so a new channel app arriving without one reds too, not
    # just an existing one losing its declaration. Section B of the same script holds the
    # other half of CE-10: no app reaches the event bus except through core's registered
    # trigger_source handler. Lives here with the other cross-app sweeps for the same reason
    # they do: the tests job runs pytest PER bundle, so no single bundle can see the
    # denominator. Each app's own tests/test_trigger_source.py drives its source to a real
    # fire; this job measures the ratio. Committed script, not an inline heredoc, so a
    # contributor runs the EXACT same check locally. Pure stdlib — no core install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every channel app declares a trigger source, and none hand-rolls glue
        run: python .github/scripts/check_trigger_source_adoption.py

  readme-census:
    # The repo-root README's app census — headline bundle count, per-category counts,
    # and the named bundles — must match the tree. This is the one fact in the repo
    # that no app's own PR owns: nine consecutive app PRs each correctly left it
    # alone and it drifted to "47 apps" over 64 bundles, with category counts that
    # summed to 56. So a machine owns it. Cross-repo sweep, same reason as its
    # neighbours: the tests job runs pytest PER bundle, and a README is no bundle's
    # test. Committed script, not an inline heredoc, so a contributor runs the EXACT
    # same check locally. Pure stdlib — no core install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: README census matches the tree
        run: python .github/scripts/check_readme_census.py

  store-card-copy:
    # Cross-app rail: `description` is documented as "One or two sentences shown on the
    # Store card", and the card renders it in a `line-clamp-2` paragraph — so a lead
    # sentence longer than two lines is shown to the user as a fragment cut mid-phrase.
    # The budget in the script is CALIBRATED against the real rendered grid (see its
    # docstring); it is a character proxy for a pixel constraint, not a style preference.
    # Rides here with the other cross-app sweeps for the same reason they do: the `tests`
    # job runs pytest per bundle, so a check over the whole catalogue has no other home.
    # Pure stdlib — no core install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every lead sentence fits the Store card
        run: python .github/scripts/check_store_card_copy.py

  publication-hygiene:
    # Cross-repo rail: this repository is PUBLIC, so `git ls-files` is exactly what every
    # clone receives — and `git rm` removes a path from the tree but never from history.
    # That makes the PR the only cheap moment to refuse an unfit path. Catches per-PR
    # screenshot dumps, scratch/residue names, build output, embedded git worktrees
    # (`git add -A` stages each as a gitlink pointing at a local absolute path), dotenvs
    # with real values, oversized binaries, and absolute paths into a real developer's home.
    # Rides here with the other cross-app sweeps because the `tests` job runs pytest per
    # bundle and these defects belong to no bundle. The script proves every pattern against
    # a sample it must catch (and one it must spare) BEFORE trusting a clean scan.
    # Pure stdlib — no core install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every tracked path is fit to publish
        run: python .github/scripts/check_publication_hygiene.py

  dco:
    # Every commit in a PR must carry a Signed-off-by trailer (DCO — plan 37),
    # same provenance rule as core. Pure-git check, PR-only.
    # Dependabot is exempt: its bot commits cannot carry a Signed-off-by trailer,
    # and dependency bumps are provenance-clear by construction. The exemption is
    # per-COMMIT (skip commits authored by dependabot), not gated on the run's
    # triggering actor — so it still holds after a maintainer pushes a fix onto a
    # dependabot branch (rebase, lockfile regen), which changes github.actor to a
    # human and would otherwise re-fail on dependabot's own unsigned commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            email="$(git show -s --format='%ae' "$sha")"
            # Skip dependabot's own commits — a bot can't sign off, and bumps are
            # provenance-clear. Maintainer commits on the same branch still checked.
            case "$email" in
              *dependabot*@users.noreply.github.com) continue ;;
            esac
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "$author"; then
              echo "::error::commit $sha is missing a matching 'Signed-off-by: $author' trailer — run: git commit -s (or git rebase --signoff)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off."
          exit "$missing"
