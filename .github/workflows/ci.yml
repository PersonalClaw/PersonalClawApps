# CI — first-party app bundles. Verifies every app against the platform contract.
# Each bundle's tests run in an environment of its own holding its declared dependencies,
# installed hashed from the bundle lock; undeclared vendor SDKs remain absent so apps that
# intentionally omit them must stub them. Every job's work is a part
# of scripts/gate.py, the one apps gate a local run calls too (`make gate`). Jobs:
# static (every .github/scripts/check_*.py, one row each, then .github/tests once: the
# rails run here, beside the bundles, so they never delay the longest job) · tests (each
# bundle's suite, four at once, each in a locked environment of its own; a pull
# request runs only the bundles its change can affect, plus every bundle claiming
# quality.tested; then the gate's quality part, core's verifier over the bundle results that
# run just wrote, which runs no suite, its verdict shown by the quality-declarations step)
# · audit (scripts/audit_locks.py: the dependency audit of every bundle lock and UI npm lock,
# waivers in .github/audit-baseline.toml; nightly on main too, in audit.yml). The commit
# policy, scripts/check_commit_provenance.py, runs in workflows of its own: dco.yml on every pull
# request and each edit of one, provenance.yml on every push to main, which nothing cancels.
# Every job that installs core installs the one commit core.lock pins (read and exported by
# scripts/core_lock.py, which prints it), so a re-run tests the same core. Core main's own
# drift is the weekly canary's to report (core-main-canary.yml), not this workflow's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own: the image's
  # system 3.12 is a different patch from the one setup-python and core's 3.12 legs run.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  static:
    # Every static check, in one job: scripts/gate.py's `static` part runs
    # .github/scripts/run_checks.py, which finds every check_*.py there (so a new check is a
    # row the first time it exists), runs each in a process of its own and keeps going past a
    # red. Each check is its own row in the job summary, named as the docs cite it
    # (boundary, manifest-validate, ui-bundles, ...), its output is a log group of its own,
    # and a failed one is an annotation naming it. The job is red when any row is.
    # Core is installed because manifest-validate parses every app.json with core's own
    # parser; Node is set up because ui-bundles rebuilds every committed UI bundle with npm.
    #
    # The same gate run then runs the `rails` part: every .github/tests file in one pytest
    # invocation over four workers (the rails over every bundle and each check's
    # planted-defect tests). They ran first in the tests job, ahead of every bundle, so a pull
    # request's verdict waited on them; this job ends well before tests does, so here they
    # add nothing to the run's wall time (.github/tests/test_rails_beside_bundles.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The rails load core, which starts no app backend with this set, as in the tests job.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install uv
        # prune-cache: setup-uv's default turned false in v10, and an unpruned cache keeps every
        # downloaded wheel (.github/tests/test_uv_cache_is_pruned.py holds every step to it).
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          prune-cache: true
      - name: Read core.lock
        # CORE_SHA and CORE_SPEC for the steps below; the log line names the core under test.
        run: uv run --no-project --python 3.12.15 python scripts/core_lock.py export
      - name: Install core + pytest
        # Core for the manifest-validate check and the rails, pytest at the pins every bundle
        # environment holds for the rails. A uv-managed venv, not `--system`: the runner's /usr
        # is PEP-668 externally-managed. Exported on PATH/env so later steps' `python` resolves
        # to it.
        run: |
          uv venv --python 3.12.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist==3.8.0
      - name: Every static check, one row each, then the repository's own tests
        # --core refuses to run when the installed core is not the locked commit. Both parts
        # run even when the first is red.
        run: python scripts/gate.py static rails --core "$CORE_SHA" --jobs 4 --results "$RUNNER_TEMP/gate"
      - name: Keep the gate's receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-static
          path: ${{ runner.temp }}/gate
          if-no-files-found: error

  tests:
    # Each bundle's test_*.py runs in an environment holding core, the pytest pins and
    # exactly its manifest-declared Python dependencies, installed from the bundle lock
    # (.github/bundle-lock/, every file hashed). Undeclared vendor SDKs remain absent, so
    # model apps still stub SDKs they deliberately do not declare.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No job-level PERSONALCLAW_HOME: one home shared by every test defeats the
    # Path.home()/HOME patches some tests isolate themselves with, the same mismatch
    # documented in the core test job. The repository's conftest.py gives each test a
    # scratch home of its own instead, so no run resolves the real ~/.personalclaw.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history, so --changed can diff a pull request against its base (a shallow
        # clone selects every bundle).
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # browser-connector's tests drive its extension worker with Node's own test runner.
        with:
          node-version-file: .nvmrc
      - name: Install uv
        # uv's cache is restored, keyed on the bundle lock, so a lock change starts a fresh
        # cache. It is pruned for CI before it is saved (`uv cache prune --ci`), so it keeps only
        # the wheels uv built from source, not every wheel it downloaded: setup-uv's default
        # turned false in v10, and the unpruned cache grew to 3.2 GB, which every run restored
        # first (.github/tests/test_uv_cache_is_pruned.py). The bundle environments themselves
        # are built in every run.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: .github/bundle-lock/*/uv.lock
      - name: Read core.lock
        # CORE_SHA and CORE_SPEC for the steps below; the log line names the core under test.
        run: uv run --no-project --python 3.12.15 python scripts/core_lock.py export
      - name: Install core + pytest
        # uv-managed venv (not `--system`: the runner's /usr is PEP-668
        # externally-managed). Exporting VIRTUAL_ENV makes later `uv pip install`
        # and `python` in this job resolve to the venv automatically.
        run: |
          uv venv --python 3.12.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install --python "$PWD/.venv/bin/python" "$CORE_SPEC" pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist==3.8.0
      - name: Each bundle's suite, then the quality claims
        # The rails run in the static job, so the bundles start at once here. scripts/gate.py's
        # `bundles` part is scripts/test_bundles.py, the single
        # definition of a bundle run shared by CI and local use: it builds each bundle's
        # environment from the bundle lock, hashed, and invokes pytest separately per bundle to
        # avoid basename clashes, four bundles at once. On a pull request --changed runs only
        # the bundles a change since the base can affect; a main-branch run takes every
        # bundle. Its `quality` part then judges the quality claims from the bundle results this
        # same run wrote (see the quality-declarations step below). Every part runs even when an
        # earlier one is red. --core refuses to run when the installed core is not the locked
        # commit. Never --float: that is the weekly canary's mode, not merge evidence. These are
        # the parts `make gate` runs too, after the static and rails parts the static job runs.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/gate.py bundles quality --core "$CORE_SHA" --jobs 4 ${BASE_SHA:+--changed "$BASE_SHA"} --results "$RUNNER_TEMP/gate"
      - name: quality-declarations
        # A `quality` block in app.json — {tested, designSystem, a11y} — is what the Store
        # renders as a badge row, so for a FIRST-PARTY app it is a promise, not decoration.
        # Core's verifier re-checks every CLAIM against the bundle's own evidence — the tests
        # actually pass, token-lint is clean, the axe report exists, matches this version and
        # is empty — and exits 1 on any claim the bundle cannot back. An axis left absent, or
        # declared honestly false ("legacy"/"n/a"), claims nothing and is never punished.
        #
        # The check IS core's module, which the gate's `quality` part invokes verbatim —
        # deliberately not a second implementation here. Re-deriving the token-lint patterns or
        # the pass rules in this repo would mint exactly the declared-vs-actual drift it exists
        # to catch, one layer down.
        #
        # The judging happens in the gate step above, in the same run as the bundles: a
        # `tested` claim is judged from the bundle results that run wrote (bundles/results.json
        # and each bundle's JUnit), never by running a suite again. A claimant with a failed
        # result, or with no result at all, is a violation, and --changed always runs every
        # claimant. The gate runs the part whatever the bundles' verdict, so a red bundle's
        # claim is reported too. This step judges nothing itself: --verdict reads the quality
        # row from that run's receipt and exits with it, so the verdict stands on a line of its
        # own. A receipt with no quality row (the gate died before the part ran), no receipt at
        # all, or a receipt for another core fails here and says so; it never passes. A
        # cancelled run skips it.
        if: ${{ !cancelled() }}
        run: python scripts/gate.py --verdict quality --core "$CORE_SHA" --results "$RUNNER_TEMP/gate"
      - name: Keep the gate's receipt and each bundle's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-tests
          path: ${{ runner.temp }}/gate
          if-no-files-found: error

  audit:
    # The dependency audit of the locks the apps ship (scripts/audit_locks.py): every bundle
    # environment's Python graph, exported from each platform's .github/bundle-lock/*/uv.lock
    # with the bundle runner's own export (the base environment and one per bundle extra), and
    # every package-lock.json a bundle ships. It fails on a tool that did not run, on a high or
    # critical finding no live waiver in .github/audit-baseline.toml covers, and on a waiver
    # that is expired, more than 30 days out, missing a field or stale. Every other finding is
    # listed in the job summary. It runs beside static and tests, so it adds no wall time to a
    # pull request; a new advisory on a dependency no pull request touched stops merging until
    # it is fixed or waived, which is the point. The nightly audit.yml runs it on main, where an
    # advisory lands without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runner identity
        # The image and architecture this job runs on, so a moved runner image shows in the log.
        run: |
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          for v in ImageOS ImageVersion RUNNER_ARCH; do
            if [ -z "${!v:-}" ]; then echo "::error::runner identity: $v is empty"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # npm audit reads each UI bundle's package-lock.json.
        with:
          node-version-file: .nvmrc
      - name: Install uv
        # The exports read the committed locks offline, so no cache is kept.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false
      # pip-audit is in no lock, so it is named as an exact release, in a venv of its own: no
      # bundle's dependencies and no core are installed into it, so what it audits is only the
      # exported locks.
      - name: pip-audit, in a venv of its own
        run: |
          uv venv --python 3.12.15 "$RUNNER_TEMP/audit-venv"
          uv pip install --python "$RUNNER_TEMP/audit-venv/bin/python" pip-audit==2.10.1
      - name: Audit the locks the apps ship
        run: >-
          "$RUNNER_TEMP/audit-venv/bin/python" scripts/audit_locks.py run
          --pip-audit "$RUNNER_TEMP/audit-venv/bin/python" --work "$RUNNER_TEMP/audit"
