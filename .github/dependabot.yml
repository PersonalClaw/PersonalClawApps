# Dependabot for the first-party app bundles. The apps declare their heavy deps
# in each app.json's pythonDependencies (installed by the platform at app-install),
# so there is no repo-level Python lockfile to track here — Dependabot watches the
# GitHub Actions the CI workflow pins. The npm manifests
# and lockfiles live in nested app UI directories, so each directory is watched
# separately and its dependency updates are grouped. Those apps commit their built bundle
# (`ui/bundle/`), so a bump that changes the build output needs a rebuild commit before it
# merges; the `ui-bundles` CI job names the bundle that differs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /growth/ui
    schedule:
      interval: weekly
    groups:
      growth-ui:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /minutes/ui
    schedule:
      interval: weekly
    groups:
      minutes-ui:
        patterns: ["*"]
